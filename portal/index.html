<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Login | Legal Wegal</title>
<meta name="description" content="Track your Legal Wegal services, upload documents, see payments and request new services. Log in with a code sent on WhatsApp.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#21115f">
<link rel="icon" href="https://erp.legalwegal.com/assets/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#21115f;--blue:#38218a;--purple:#6b4bd2;--teal:#0f766e;--red:#dc4545;--ink:#201b35;--muted:#706b83;--line:#e8e4f1;--bg:#f7f6fb;--soft:#efeaff;--ok:#e6f6f3;--warn:#fff4e0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit}
.top{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.brand{font-weight:700;letter-spacing:.2px}.brand small{display:block;font-weight:400;opacity:.75;font-size:12px}
.top button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 12px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:18px 14px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:4px 0 4px}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 8px}
.muted{color:var(--muted);font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input[type=tel],input[type=text],textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
input:focus,textarea:focus{outline:2px solid var(--purple);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 18px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.btn.full{width:100%}.btn.ghost{background:var(--soft);color:var(--blue)}.btn.green{background:#1fa855}.btn.sm{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.login{max-width:420px;margin:30px auto}
.codebox{letter-spacing:10px;text-align:center;font-size:24px!important;font-weight:700}
.steps{display:flex;gap:4px;margin:12px 0 4px}.steps div{flex:1;height:6px;border-radius:4px;background:var(--line)}.steps div.on{background:var(--teal)}
.steplabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;background:var(--soft);color:var(--blue);font-weight:600}
.pill.ok{background:var(--ok);color:var(--teal)}.pill.warn{background:var(--warn);color:#9a5b00}.pill.bad{background:#fde8e8;color:var(--red)}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.money div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}.money b{display:block;font-size:17px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.doc{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs button{border:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.wa{position:fixed;right:16px;bottom:16px;background:#1fa855;color:#fff;border-radius:30px;padding:12px 18px;font-weight:600;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:20}
.hide{display:none!important}
@media print{.top,.tabs,.wa,.noprint{display:none!important}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<div class="top"><div class="brand">Legal Wegal<small>Client portal</small></div><button id="logout" class="hide" onclick="logout()">Log out</button></div>

<main>
  <!-- Login -->
  <section id="loginView" class="login hide">
    <div class="card">
      <h1>Log in</h1>
      <p class="muted">Use the mobile number you gave us. We'll send a 6-digit code on WhatsApp.</p>
      <div id="stepPhone">
        <label for="phone">Mobile number</label>
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="98765 43210">
        <div class="err" id="phoneErr"></div>
        <button class="btn full" id="sendBtn" onclick="sendCode()">Send code on WhatsApp</button>
      </div>
      <div id="stepCode" class="hide">
        <label for="code">Code sent to <b id="sentTo"></b></label>
        <input id="code" class="codebox" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
        <div class="err" id="codeErr"></div>
        <button class="btn full" id="verifyBtn" onclick="verifyCode()">Log in</button>
        <p class="muted" style="text-align:center;margin-top:12px"><a href="#" onclick="resetLogin();return false">Change number</a> · <a href="#" id="resend" onclick="sendCode(true);return false">Resend code</a></p>
      </div>
    </div>
    <p class="muted" style="text-align:center">New to Legal Wegal? <a href="https://erp.legalwegal.com/enquiry.html">Send an enquiry</a></p>
  </section>

  <!-- App -->
  <section id="appView" class="hide">
    <h1 id="hello">Hello</h1>
    <p class="muted" id="sub"></p>
    <div class="tabs noprint">
      <button data-t="services" class="on" onclick="tab('services')">My services</button>
      <button data-t="docs" onclick="tab('docs')">Documents</button>
      <button data-t="pay" onclick="tab('pay')">Payments</button>
      <button data-t="renew" onclick="tab('renew')">Renewals</button>
      <button data-t="new" onclick="tab('new')">+ New service</button>
    </div>
    <div id="tab-services"></div>
    <div id="tab-docs" class="hide"></div>
    <div id="tab-pay" class="hide"></div>
    <div id="tab-renew" class="hide"></div>
    <div id="tab-new" class="hide"></div>
  </section>
  <div id="loading" class="empty">Loading…</div>
</main>
<a class="wa noprint" href="https://wa.me/919370077727?text=Hi%20Legal%20Wegal%2C%20I%20need%20help%20with%20my%20service" target="_blank" rel="noopener">WhatsApp us</a>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" class="hide" accept="application/pdf,image/*">

<script>
// Own storage key: never touches a CRM staff session on the same domain.
const sb = supabase.createClient('https://smedmzwiddhmxaznqoen.supabase.co','sb_publishable_Y14BKYhQ7k7xSL8jhX6vFg_scknKxpe', { auth: { storageKey: 'lw-client-portal', persistSession: true } });
let data = null, phone10 = '', pickTarget = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const dt = d => d ? new Date(d).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : '';
function toast(t){ const el=$('toast'); el.textContent=t; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',3000); }
function show(view){ $('loading').classList.add('hide'); $('loginView').classList.toggle('hide', view!=='login'); $('appView').classList.toggle('hide', view!=='app'); $('logout').classList.toggle('hide', view!=='app'); }

// ---------- Login ----------
function clean10(v){ const d=String(v).replace(/\D/g,''); return d.length>10 ? d.slice(-10) : d; }
async function sendCode(resend){
  const p = resend ? phone10 : clean10($('phone').value);
  $('phoneErr').textContent='';
  if(!/^[6-9]\d{9}$/.test(p)){ $('phoneErr').textContent='Enter a valid 10-digit Indian mobile number.'; return; }
  phone10 = p; $('sendBtn').disabled = true;
  const { error } = await sb.auth.signInWithOtp({ phone: '+91' + p, options: { channel: 'sms' } });
  $('sendBtn').disabled = false;
  if(error){ (resend?$('codeErr'):$('phoneErr')).textContent = friendly(error.message); return; }
  $('sentTo').textContent = '+91 ' + p.slice(0,5) + ' ' + p.slice(5);
  $('stepPhone').classList.add('hide'); $('stepCode').classList.remove('hide'); $('code').focus();
  if(resend) toast('New code sent on WhatsApp');
}
async function verifyCode(){
  const code = $('code').value.replace(/\D/g,''); $('codeErr').textContent='';
  if(code.length!==6){ $('codeErr').textContent='Enter the 6-digit code.'; return; }
  $('verifyBtn').disabled = true;
  const { error } = await sb.auth.verifyOtp({ phone: '+91' + phone10, token: code, type: 'sms' });
  $('verifyBtn').disabled = false;
  if(error){ $('codeErr').textContent = friendly(error.message); return; }
  load();
}
$('code').addEventListener('input', e => { if(e.target.value.replace(/\D/g,'').length===6) verifyCode(); });
$('phone').addEventListener('keydown', e => { if(e.key==='Enter') sendCode(); });
function resetLogin(){ $('stepCode').classList.add('hide'); $('stepPhone').classList.remove('hide'); $('code').value=''; }
function friendly(m){
  if(/expired|invalid/i.test(m)) return 'That code is wrong or has expired. Tap "Resend code".';
  if(/rate|seconds/i.test(m)) return 'Please wait a minute before asking for another code.';
  return m || 'Something went wrong. Please try again.';
}
async function logout(){ await sb.auth.signOut({ scope: 'local' }); data=null; resetLogin(); show('login'); }

// ---------- Data ----------
async function load(){
  const { data: sess } = await sb.auth.getSession();
  if(!sess.session || !sess.session.user.phone){ show('login'); return; }
  const { data: d, error } = await sb.rpc('client_dashboard');
  if(error){ await sb.auth.signOut({ scope: 'local' }); show('login'); $('phoneErr').textContent = 'Could not load your account. Please log in again.'; return; }
  data = d; phone10 = d.phone; render(); show('app');
}
function render(){
  const first = (data.name || '').split(' ')[0];
  $('hello').textContent = first ? `Hello, ${first}` : 'Welcome';
  const n = data.services.length;
  $('sub').textContent = n ? `${n} service${n>1?'s':''} with Legal Wegal · +91 ${data.phone}` : `+91 ${data.phone}`;
  renderServices(); renderDocs(); renderPay(); renderRenew(); renderNew();
}
function tab(t){ document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===t)); ['services','docs','pay','renew','new'].forEach(x=>$('tab-'+x).classList.toggle('hide', x!==t)); window.scrollTo(0,0); }
const svcName = s => (s.services && s.services.length) ? s.services.join(', ') : 'Legal service';
const statusPill = s => `<span class="pill ${s.step===4?'ok':s.step===1?'warn':''}">${esc(s.status)}</span>`;

function renderServices(){
  const el = $('tab-services');
  if(!data.services.length){ el.innerHTML = `<div class="card empty">We couldn't find any services for this number yet.<br><br><button class="btn" onclick="tab('new')">Request a service</button></div>`; return; }
  el.innerHTML = data.services.map(s => {
    const need = docItems(s).filter(i => !i.done).length;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h2>${esc(svcName(s))}</h2>${statusPill(s)}</div>
      <div class="muted">${s.code ? 'Ref ' + esc(s.code) + ' · ' : ''}Started ${dt(s.created_at)}${s.completed_date ? ' · Completed ' + dt(s.completed_date) : ''}</div>
      <div class="steps">${[1,2,3,4].map(i=>`<div class="${i<=s.step?'on':''}"></div>`).join('')}</div>
      <div class="steplabels"><span>Enquiry</span><span>Documents</span><span>In progress</span><span>Done</span></div>
      ${s.fee || s.paid || s.balance ? `<div class="money"><div><span class="muted">Fee</span><b>${s.fee?inr(s.fee):'—'}</b></div><div><span class="muted">Paid</span><b>${inr(s.paid)}</b></div><div><span class="muted">Balance</span><b style="color:${s.balance>0?'var(--red)':'var(--teal)'}">${inr(s.balance)}</b></div></div>` : ''}
      ${s.courier ? `<div class="row"><span>📦 ${esc(s.courier.name||'Courier')} · ${esc(s.courier.id)}</span>${s.courier.link?`<a class="btn sm ghost" href="${esc(s.courier.link)}" target="_blank" rel="noopener">Track</a>`:''}</div>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        ${need && s.step<4 ? `<button class="btn sm" onclick="tab('docs')">Upload ${need} document${need>1?'s':''}</button>` : ''}
        ${s.balance>0 ? `<button class="btn sm green" onclick="tab('pay')">Pay ${inr(s.balance)}</button>` : ''}
      </div>
    </div>`; }).join('');
}

function docItems(s){
  const items = [];
  (s.documents_needed||[]).forEach(g => String(g.list||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(name => {
    const up = (s.uploads||[]).filter(u => u.doc_name.toLowerCase() === name.toLowerCase());
    const last = up[0];
    items.push({ name, service: g.service, last, done: last && last.status !== 'rejected' });
  }));
  return items;
}
function renderDocs(){
  const el = $('tab-docs');
  const active = data.services.filter(s => s.step < 4);
  if(!data.services.length){ el.innerHTML = `<div class="card empty">No services yet.</div>`; return; }
  el.innerHTML = (active.length ? active : data.services).map(s => {
    const items = docItems(s);
    const extra = (s.uploads||[]).filter(u => !items.some(i => i.name.toLowerCase()===u.doc_name.toLowerCase()));
    return `<div class="card"><h2>${esc(svcName(s))}</h2>
      <p class="muted">PDF or photo, up to 10 MB each. Only our team working on your file can see them.</p>
      ${items.length ? items.map(i => `<div class="doc"><div><div>${esc(i.name)}</div>${i.last?`<div class="muted">${esc(i.last.file_name||'')} · ${docPill(i.last)}${i.last.note?' · '+esc(i.last.note):''}</div>`:''}</div>
        <button class="btn sm ${i.done?'ghost':''}" onclick="pick('${s.id}', ${JSON.stringify(i.name).replace(/"/g,'&quot;')})">${i.done?'Replace':'Upload'}</button></div>`).join('')
        : '<p class="muted">Our team will tell you which documents are needed.</p>'}
      ${extra.map(u => `<div class="doc"><div><div>${esc(u.doc_name)}</div><div class="muted">${esc(u.file_name||'')} · ${docPill(u)}</div></div></div>`).join('')}
      <div style="margin-top:12px"><button class="btn sm ghost" onclick="pickOther('${s.id}')">+ Upload another document</button></div>
    </div>`; }).join('');
}
const docPill = u => u.status==='accepted' ? '<span class="pill ok">Accepted</span>' : u.status==='rejected' ? '<span class="pill bad">Please re-upload</span>' : '<span class="pill">Received</span>';
function pick(leadId, docName){ pickTarget = { leadId, docName }; $('filePick').value=''; $('filePick').click(); }
function pickOther(leadId){ const n = prompt('What is this document? (e.g. Rent agreement)'); if(n && n.trim()) pick(leadId, n.trim()); }
$('filePick').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f || !pickTarget) return;
  if(f.size > 10*1024*1024){ toast('File is larger than 10 MB'); return; }
  toast('Uploading…');
  const safe = f.name.replace(/[^\w.\-]+/g,'_').slice(-80);
  const path = `${phone10}/${pickTarget.leadId}/${Date.now()}_${safe}`;
  const up = await sb.storage.from('client-docs').upload(path, f, { contentType: f.type || 'application/octet-stream' });
  if(up.error){ toast('Upload failed: ' + up.error.message); return; }
  const { error } = await sb.rpc('client_add_document', { p_lead_id: pickTarget.leadId, p_doc_name: pickTarget.docName, p_path: path, p_file_name: f.name, p_size: f.size, p_mime: f.type });
  if(error){ toast('Could not save: ' + error.message); return; }
  toast('Uploaded ✓'); await load(); tab('docs');
});

function renderPay(){
  const el = $('tab-pay');
  const due = data.services.filter(s => s.balance > 0);
  const paid = data.services.flatMap(s => (s.payments||[]).map(p => ({...p, svc: svcName(s), code: s.code})));
  let h = '';
  if(due.length){
    h += `<div class="card"><h2>To pay</h2>` + due.map(s => {
      const upi = data.upi_id ? `upi://pay?pa=${encodeURIComponent(data.upi_id)}&pn=${encodeURIComponent('Legal Wegal')}&am=${Number(s.balance).toFixed(2)}&cu=INR&tn=${encodeURIComponent((s.code||'') + ' ' + svcName(s)).slice(0,80)}` : '';
      return `<div class="row"><div><div>${esc(svcName(s))}</div><div class="muted">${s.code?'Ref '+esc(s.code):''}</div></div><div style="text-align:right"><b>${inr(s.balance)}</b><br>
        ${upi ? `<a class="btn sm green" href="${upi}">Pay by UPI</a>` : `<a class="btn sm green" href="https://wa.me/919370077727?text=${encodeURIComponent('Please share payment details for ' + (s.code||svcName(s)))}" target="_blank" rel="noopener">Get payment link</a>`}</div></div>`; }).join('')
      + `<p class="muted">After paying, the payment shows here once our team confirms it.${data.upi_id?' UPI ID: <b>'+esc(data.upi_id)+'</b>':''}</p></div>`;
  }
  h += `<div class="card"><h2>Payments received</h2>` + (paid.length ? paid.map(p => `<div class="row"><div><div>${inr(p.amount)} · ${esc(p.svc)}</div><div class="muted">${dt(p.date)}${p.type?' · '+esc(p.type):''}</div></div><button class="btn sm ghost" onclick='receipt(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Receipt</button></div>`).join('') : '<p class="muted">No payments yet.</p>') + `</div>`;
  el.innerHTML = h;
}
function receipt(p){
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>Receipt ${esc(p.code||'')}</title><style>body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;color:#201b35}h1{color:#21115f;margin:0}table{width:100%;border-collapse:collapse;margin:24px 0}td{padding:10px;border-bottom:1px solid #e8e4f1}td:last-child{text-align:right}.big{font-size:22px;font-weight:700}</style></head><body>
  <h1>Legal Wegal</h1><p>Payment receipt</p>
  <table><tr><td>Received from</td><td>${esc(data.name||'')} (+91 ${esc(data.phone)})</td></tr>
  <tr><td>Service</td><td>${esc(p.svc)}</td></tr>${p.code?`<tr><td>Reference</td><td>${esc(p.code)}</td></tr>`:''}
  <tr><td>Date</td><td>${dt(p.date)}</td></tr>${p.type?`<tr><td>Towards</td><td>${esc(p.type)}</td></tr>`:''}
  <tr><td>Amount</td><td class="big">${inr(p.amount)}</td></tr></table>
  <p style="color:#706b83;font-size:13px">This is a payment acknowledgement generated from the Legal Wegal client portal. For a tax invoice, message us on WhatsApp +91 93700 77727.</p>
  <script>setTimeout(()=>print(),300)<\/script></body></html>`);
  w.document.close();
}

function renderRenew(){
  const el = $('tab-renew');
  el.innerHTML = `<div class="card"><h2>Upcoming renewals</h2>` + (data.renewals.length ? data.renewals.map(r => {
    const days = Math.ceil((new Date(r.due_date) - new Date()) / 864e5);
    return `<div class="row"><div><div>${esc(r.service)}</div><div class="muted">Due ${dt(r.due_date)} · ${days>=0?days+' days left':'overdue'}</div></div><button class="btn sm" onclick="quickRequest(${JSON.stringify(r.service).replace(/"/g,'&quot;')}, 'Renewal due ${dt(r.due_date)}')">Renew</button></div>`; }).join('')
    : '<p class="muted">No renewals due. We will remind you on WhatsApp before anything expires.</p>') + `</div>`;
}

let chosen = new Set();
function renderNew(){
  const el = $('tab-new');
  el.innerHTML = `<div class="card"><h2>Request a new service</h2><p class="muted">Pick one or more. Our expert will call you, usually within a few working hours.</p>
    <div class="chips">${(data.service_options||[]).map(o => `<button class="chip ${chosen.has(o)?'on':''}" onclick="toggleChip(this, ${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}</div>
    <label for="reqNote">Anything we should know? (optional)</label><textarea id="reqNote" rows="3" maxlength="500"></textarea>
    <div class="err" id="reqErr"></div>
    <button class="btn full" id="reqBtn" onclick="submitRequest()">Send request</button></div>`;
}
function toggleChip(b, o){ chosen.has(o) ? chosen.delete(o) : chosen.add(o); b.classList.toggle('on'); }
async function submitRequest(){
  if(!chosen.size){ $('reqErr').textContent = 'Choose at least one service.'; return; }
  $('reqBtn').disabled = true;
  const { error } = await sb.rpc('client_request_service', { p_services: [...chosen], p_note: $('reqNote').value });
  $('reqBtn').disabled = false;
  if(error){ $('reqErr').textContent = error.message; return; }
  chosen = new Set(); toast('Request sent ✓ Our team will contact you soon'); await load(); tab('services');
}
async function quickRequest(service, note){
  if(!confirm(`Request renewal of ${service}?`)) return;
  const known = (data.service_options||[]).find(o => o.toLowerCase() === String(service).toLowerCase());
  const { error } = await sb.rpc('client_request_service', { p_services: [known || service], p_note: note });
  if(error){ toast(error.message); return; }
  toast('Renewal request sent ✓'); await load(); tab('services');
}

sb.auth.onAuthStateChange((ev) => { if(ev === 'SIGNED_OUT') show('login'); });
load();
</script>
</body>
</html>
